[project]
name = "splunk-agent"
version = "0.2.0"
description = "LLM assistant for building and fixing Splunk SPL (SIEM detections and traceability dashboards)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.67",
    "langchain-core>=0.3",
    "langchain-groq>=0.3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "ddgs>=9.0",
    "python-dotenv>=1.0",
    "langchain-ollama>=0.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[dependency-groups]
dev = [
    "playwright>=1.65.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["splunk_agent", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
